# EXPLORATOIRE (2026-10-02, train) : identique à model_clinical_v2.yaml sauf l ASR du score clinique (large-v3-turbo).
# Avenant n° 2 daté du 2026-10-02 (configs/model.yaml et model_clinical.yaml inchangés).
# Motif : équité par sexe (results/13_robustness) — avec le sexe comme prédicteur, spécificité 0,58 chez les hommes
# vs 0,80 chez les femmes. Âge et sexe sont déjà dans les normes HC (G, D, z) : on les retire du classifieur.
# Décision prise sur le TRAIN uniquement ; test non touché.
#
# Motif : avec des unités VAD, D n'apporte rien à G (results/10_model). Les unités VAD sont un proxy du score clinique ;
# on remplace la mesure principale de fluence par le score standard (mots valides distincts par seconde, fenêtre
# min(durée, 45 s), Whisper horodaté, scripts/11_clinical_scores.py). Choisi AVANT de voir les résultats prédictifs
# de ce score ; test officiel non touché. Le reste du protocole est identique.

seed: 42
split: Train
output_dir: results/10_model_clinical_v2_turbo
extra_feature_files: [results/cache/22_whisper_turbo/clinical_turbo.csv]
cv: {n_splits: 5, n_repeats: 5}
n_permutations: 1000
normative: {huber_epsilon: 1.35, inner_crossfit_splits: 5}
fluency_measures:
  valid_per_s_turbo: none        # exploratoire : Whisper large-v3-turbo
  median_gap_s: log
  long_silences_per_min: log1p
  units_slope: none
ctd_measures:
  pause_rate_per_min: log1p
  articulation_rate: none
covariates: [age, male]
models:
  A_cov: [cov]
  B_G_nocov: [G, ctd]              # modèle principal proposé (sexe et âge seulement via les normes)
  B_G_age: [age, G, ctd]
  B_G: [cov, G, ctd]
  C_G_D: [cov, G, D, ctd]
  D_only: [cov, D]
  Z_tasks: [cov, z_SFT, z_PFT, ctd]
main_comparison: [B_G_nocov, B_G]
classifier:
  binary: "StandardScaler + LogisticRegression(class_weight=balanced, C=1)"
  three_class: "ordinal Frank & Hall : LR(y > HC), LR(y > MCI), class_weight=balanced, C=1"
metrics:
  primary: "HC vs MCI+Dementia : AUC, accuracy équilibrée"
  secondary: "3 classes : macro-F1, accuracy équilibrée, AUC macro OvR"
